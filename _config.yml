title: Unbiased News Feed
tagline: Showing how the world's media frames the same story.
description: A daily edition of the five top UK stories, with a neutral summary of each and a comparison of how outlets worldwide framed it.
bias_note: "Bias Spread: 1 means near-identical framing across outlets, 10 means sharply divergent framing. It is not a verdict on who is right."

# Project site: https://ukwebfilter.github.io/UKWebFilter/
url: https://ukwebfilter.github.io
baseurl: /UKWebFilter

lang: en
timezone: Europe/London

markdown: kramdown
kramdown:
  input: GFM
  hard_wrap: false

# One page per edition: /2026/10/06/
permalink: /:year/:month/:day/

# A file in _posts is published when it is pushed, including if its date
# is still later today in another timezone.
future: true

plugins:
  - jekyll-feed

defaults:
  - scope:
      path: ""
      type: posts
    values:
      layout: edition

exclude:
  - Gemfile
  - Gemfile.lock
  - vendor
  - README.md
  - .gitignore
  - .bundle
