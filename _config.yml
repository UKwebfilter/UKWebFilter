title: Natter
tagline: "The news. The framing. The bigger picture."
tagline_sub: "Natter compares how different news outlets cover the same stories, highlighting the facts, differences in emphasis and the narratives shaping what you read."
description: "Natter compares how different news outlets cover the same stories, highlighting the facts, differences in emphasis and the narratives shaping what you read."

# Public Buttondown embed URL (free plan). Not a secret and not a paid embed.
# Replace the placeholder before signup should deliver mail:
#   newsletter_action: "https://buttondown.com/api/emails/embed-subscribe/YOUR_USERNAME"
# This repo builds with the github-pages gem, which runs in safe mode, so the
# URL cannot be injected from the environment at build time. Put it here.
# A gitignored _config.local.yml can override it for a local build; see README.
newsletter_action: "#"

# Desktop story collage: tile positions (1-based, in banner_tiles order) to
# leave out on desktop so the grid fits the reading column. 5 and 10 are the
# last UK and last World story, giving a 2x4 grid. A post can override this
# with its own banner_desktop_drop (use [] to show all 10). Mobile always
# shows every tile.
banner_desktop_drop: [5, 10]

# Apex custom domain, no subpath: https://natter.tv
url: https://natter.tv
baseurl: ""

lang: en
timezone: Europe/London

markdown: kramdown
kramdown:
  input: GFM
  hard_wrap: false

# One page per edition: /2026/10/06/
permalink: /:year/:month/:day/

# A file in _posts is published when it is pushed, including if its date
# is still later today in another timezone.
future: true

plugins:
  - jekyll-feed

defaults:
  - scope:
      path: ""
      type: posts
    values:
      layout: edition

exclude:
  - Gemfile
  - Gemfile.lock
  - vendor
  - README.md
  - .gitignore
  - .bundle
